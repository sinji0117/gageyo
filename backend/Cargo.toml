[workspace]
resolver = "2"
members = [
    "crates/core",
    "modules/workshop",
    "modules/commerce",
    "modules/support",
    "crates/api",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
publish = false

[workspace.dependencies]
axum = { version = "0.8", features = ["macros", "multipart"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace", "compression-gzip", "limit"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "mysql", "migrate", "chrono", "json"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"
dotenvy = "0.15"
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
hex = "0.4"
base64 = "0.22"
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls-tls", "ring", "webpki-roots", "hostname"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

gageyo-core = { path = "crates/core" }
gageyo-workshop = { path = "modules/workshop" }
gageyo-commerce = { path = "modules/commerce" }
gageyo-support = { path = "modules/support" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
