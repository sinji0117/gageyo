# 임시 개발용: 빌드·테스트 전체 로그를 ci-logs 브랜치에 남깁니다. 작업이 끝나면 지웁니다.
name: dev-logs
on:
  push:
    branches: ["feature/**"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_DATABASE: gageyo_db
          MARIADB_USER: gageyo_user
          MARIADB_PASSWORD: devpass
          MARIADB_ROOT_PASSWORD: devroot
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: backend }
      - name: build and test
        run: |
          mkdir -p /tmp/logs
          set +e
          (cd backend && cargo build 2>&1) > /tmp/logs/cargo-build.log; echo "cargo build: $?" >> /tmp/logs/summary.txt
          (cd backend && cargo test 2>&1) > /tmp/logs/cargo-test.log; echo "cargo test: $?" >> /tmp/logs/summary.txt
          (cd frontend && npm install --no-audit --no-fund 2>&1 && npm run build 2>&1) > /tmp/logs/frontend.log; echo "frontend: $?" >> /tmp/logs/summary.txt
          if [ -x scripts/e2e.sh ]; then
            export DATABASE_URL=mysql://gageyo_user:devpass@127.0.0.1:3306/gageyo_db
            bash scripts/e2e.sh > /tmp/logs/e2e.log 2>&1; echo "e2e: $?" >> /tmp/logs/summary.txt
          fi
          cat /tmp/logs/summary.txt
      - name: publish logs
        if: always()
        run: |
          sha=${GITHUB_SHA::12}
          git config user.name ci-logs; git config user.email ci-logs@users.noreply.github.com
          git fetch origin ci-logs:ci-logs 2>/dev/null && git checkout ci-logs || git checkout --orphan ci-logs
          git rm -rq --cached . 2>/dev/null || true
          mkdir -p logs/$sha && cp /tmp/logs/* logs/$sha/ 2>/dev/null || true
          git add -f logs/$sha && git commit -qm "logs $sha" && git push -q origin ci-logs
