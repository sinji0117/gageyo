name: diag
on:
  push:
    branches: ["fix/**"]
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: ["direct-minimal", "old-main"]
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@nightly
      - name: build
        working-directory: backend
        run: |
          if [ "${{ matrix.mode }}" = old-main ]; then git checkout -q ebfeacb; fi
          if [ "${{ matrix.mode }}" = direct-minimal ]; then cargo update -Z direct-minimal-versions 2>&1 | tail -2; fi
          cargo build --release -p gageyo-workshop --message-format=short 2>&1 | sed "s/\x1b\[[0-9;]*m//g" > /tmp/b.log; tail -3 /tmp/b.log
          grep -E "^(error|modules|crates)" /tmp/b.log | head -30 | while IFS= read -r l; do echo "::error::${{ matrix.mode }} | $l"; done
          ! grep -q "^error" /tmp/b.log
