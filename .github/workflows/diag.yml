name: diag
on:
  push:
    branches: ["fix/**"]
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: ["1.84", "1.86", "1.87"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: "${{ matrix.rust }}" }
      - name: build
        working-directory: backend
        run: |
          cargo build --release --message-format=short 2>&1 | tee /tmp/b.log | tail -3
          v=$(rustc --version)
          grep -E "error" /tmp/b.log | head -20 | while IFS= read -r l; do echo "::error::$v | $l"; done
          ! grep -q "^error" /tmp/b.log
